name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and public-surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/quality/audit_public_exposure.py

  frontend:
    name: Frontend test, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser for public dashboard checks
        run: npx playwright install --with-deps chromium
      - name: Verify public dashboard behavior in the production build
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-dashboard-browser-report
          path: frontend/playwright-report/
          retention-days: 7
