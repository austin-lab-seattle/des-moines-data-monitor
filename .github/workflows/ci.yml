name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-r:
    name: R research download client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install research client dependencies
        run: Rscript -e 'install.packages(c("httr2", "openssl"))'
      - name: Check key-only exports without external requests
        run: Rscript tests/test_research_download_client.R

  python:
    name: Python tests and public-surface audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/quality/audit_public_exposure.py

  frontend:
    name: Frontend test, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser for public dashboard checks
        run: npx playwright install --with-deps chromium
      - name: Install offline approval emulator for real-handler browser contracts
        run: python -m pip install -r ../requirements-test.txt
      - name: Verify public dashboard behavior in the production build
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: public-dashboard-browser-report
          path: frontend/playwright-report/
          retention-days: 7
